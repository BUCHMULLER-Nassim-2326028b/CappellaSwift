name: Prepare GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  macos:
    uses: ./.github/workflows/macos.yml
  windows:
    uses: ./.github/workflows/windows.yml
  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: Cappella-*-*-*
          merge-multiple: true
          skip-decompress: true
          path: release
      - name: Create draft with all five distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          version="${RELEASE_TAG#v}"
          assets=(
            "Cappella-$version-macOS-arm64-Portable.zip"
            "Cappella-$version-Windows-x64-Portable.zip"
            "Cappella-$version-Windows-x64-Setup.exe"
            "Cappella-$version-Windows-arm64-Portable.zip"
            "Cappella-$version-Windows-arm64-Setup.exe"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "Cappella $RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt
