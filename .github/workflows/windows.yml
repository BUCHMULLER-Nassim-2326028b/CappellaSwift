name: Native Windows (Swift-WinRT)
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ['**']
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'windows/**', 'packaging/**', 'scripts/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'windows/**', 'packaging/**', 'scripts/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    name: Windows ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
            toolchain_arch: amd64
          - architecture: arm64
            runner: windows-11-arm
            toolchain_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-vsdevenv@5eb3eae1490d4f7875d574c4973539f69109700d
        with:
          arch: ${{ matrix.toolchain_arch }}
          host_arch: ${{ matrix.toolchain_arch }}
      - uses: compnerd/gha-setup-swift@db4ffac97c2db518c2ff4f37f988af89e4411240
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
          build_arch: ${{ matrix.toolchain_arch }}
      - name: Verify native architecture
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_ARCH) { throw "Runner $actual, expected $env:EXPECTED_ARCH." }
      - name: Generate WinRT projections
        shell: pwsh
        run: ./scripts/prepare-windows.ps1
      - name: Unit tests
        shell: pwsh
        run: |
          swift test -c release -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable application
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipPrepare -Architecture ${{ matrix.architecture }}
      - name: Install WinUI runtime
        shell: powershell
        run: ./windows/Installer-runtime.ps1 -Architecture ${{ matrix.architecture }}
      - name: Launch empty editor and open DetX
        shell: pwsh
        env:
          APP_ARCH: ${{ matrix.architecture }}
        run: |
          $executable = "dist/Cappella-Windows-$env:APP_ARCH/Cappella.exe"
          ./scripts/smoke-windows.ps1 -Executable $executable
          ./scripts/smoke-windows.ps1 -Executable $executable -Fixture Tests/Fixtures/layout.detx
          ./scripts/check-windows-activation.ps1 -Executable $executable -Fixture Tests/Fixtures/layout.detx
          python scripts/make_load_fixture.py dist/load.detx --count 1000
          ./scripts/smoke-windows.ps1 -Executable $executable -Fixture dist/load.detx -ExpectedCues 1000
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Architecture ${{ matrix.architecture }}
      - name: Upload portable
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/Cappella-*-Windows-${{ matrix.architecture }}-Portable.zip
          if-no-files-found: error
      - name: Upload setup
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/Cappella-*-Windows-${{ matrix.architecture }}-Setup.exe
          if-no-files-found: error
